# gitleaks over the commits of every pull request (MOL-369). The repository is public with every pull
# request's ref: a secret committed is read before it is removed, so it is rotated, never rewritten out
# (`.claude/rules/security.md`, «Secrets»). GitHub's push protection knows the providers' tokens; this
# adds the shapes of our own and the generic `key = '…'`.

[extend]
useDefault = true

# A ping URL of healthchecks.io: whoever has one can say «alive» for the check (deploy.md). By its uuid
# or by a project's ping key and a slug, on any host healthchecks.io answers a ping at — `hc-ping.com`,
# the same as a full name `hc-ping.com.`, and the old `hchk.io` — in any case, as DNS takes a host
# (MOL-399, adversarial round 4, Б4). The placeholders of the tests (`0f1e2d3c-secret`, `pk/…`) are
# neither form; the two uuids of the watch's tests are, and only the allowlist below lets them go.
[[rules]]
id = "healthchecks-ping-url"
description = "healthchecks.io ping URL"
regex = '''(?i)(?:hc-ping\.com\.?|hchk\.io)/(?:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|[A-Za-z0-9_-]{22}/[a-z0-9-]+)'''
keywords = ["hc-ping.com", "hchk.io"]

# A Telegram bot's token by its shape alone: the default rule wants `telegr…` in the name beside it, and a
# token pasted as `const TOKEN = '…'` passed it. Its colon is out of the generic rule's reach too. Bounded on
# the left by what is no digit rather than `\b` — in Bot API's address it follows `…/bot` (adversarial А4) —
# and not on the right: its last sign may be `-` (А5), and a bound there, with no lookahead in Go's regexp,
# took the comma a second token stands after and left that one unfound and unredacted (В1).
[[rules]]
id = "telegram-bot-token-bare"
description = "Telegram bot token, whatever it is called"
regex = '''(?:^|[^0-9])(\d{8,10}:AA[0-9A-Za-z_-]{33})'''
secretGroup = 1
keywords = [":aa"]

# The values of the tests, by their value and for the generic rule alone (owner's Р-2): a path such as
# `*.test.ts` would pass a real token pasted into a test, and a pattern given to every rule would
# silence the one above, whose URL holds a uuid.
[[allowlists]]
description = "Test values the generic rule takes for keys"
targetRules = ["generic-api-key"]
regexes = [
  # An id — a `clientKey`, a row's uuid — is no secret.
  '''^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$''',
  # A build as `/api/health` names it (MOL-371).
  '''^v\d+\.\d+\.\d+-\d+-g[0-9a-f]{7,40}$''',
  # The session token of the tests: base64url of «foobar-token-32-bytes-base64url».
  '''^Zm9vYmFyLXRva2VuLTMyLWJ5dGVzLWJhc2U2NHVybA$''',
  # The key of a feedback draft in end-to-end.
  '''^aa00bb11cc22dd33ee44ff55$''',
]

# The model's files are checked by their sha256 (MOL-105) — in that file only.
[[allowlists]]
description = "sha256 of the embedding model's files"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^backend/src/embeddings/model\.json$''']
regexes = ['''^[0-9a-f]{64}$''']

# The two made-up checks of the watch's tests (MOL-399, adversarial round 2, Б2): the lock's round takes check
# URLs by their uuid alone, so its tests need two in that form. Let go by their exact value and for the ping
# rule alone — any other uuid, on any host of the rule, is still found.
[[allowlists]]
description = "The watch's test checks by uuid"
targetRules = ["healthchecks-ping-url"]
regexes = [
  '''^hc-ping\.com/0f1e2d3c-4b5a-4c6d-8e7f-a0b1c2d3e4f5$''',
  '''^hc-ping\.com/9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d$''',
]
