name: CI

on:
  push:
    branches: [master]
  pull_request:

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: format, lint, types, tests
    runs-on: ubuntu-latest

    # Integration tests run against a real Postgres: pg_trgm and unaccent cannot be
    # faked, and they are exactly what catalogue search will stand on. The port and the
    # credentials match what bin/init-env.sh writes, so CI and a working copy agree.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: molvia_0
          POSTGRES_USER: molvia
          POSTGRES_PASSWORD: molvia
        ports:
          - 5500:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # The same generator every working copy uses, so CI cannot drift from local setup.
      - run: ./bin/init-env.sh 0

      # `make format` mutates files, so CI checks instead of fixing: a diff must fail,
      # not be silently repaired.
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  e2e:
    name: end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: ./bin/init-env.sh 0

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
