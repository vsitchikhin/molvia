name: CI

on:
  push:
    branches: [master]
  pull_request:

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: format, lint, types
    runs-on: ubuntu-latest

    steps:
      # The whole history: gitleaks reads the pull request's own commits, `HEAD^1..HEAD^2` of the merge.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A secret in any commit of the pull request (MOL-369): its ref is public, so a commit removed later
      # leaks all the same, and the step stays red until the secret is rotated and its fingerprint goes into
      # `.gitleaksignore`. First, so it is red in seconds; `--redact`, since the log of a public repository
      # is public too. A push to master needs none: master takes pull requests alone, read here.
      - name: secrets in the pull request's commits
        if: github.event_name == 'pull_request'
        run: |
          docker build --quiet --tag molvia-gitleaks .github/scanners/gitleaks
          # `safe.directory` for a run where the checkout is not the container's uid — a copy on a Mac.
          image() {
            docker run --rm --volume "$PWD:/repo:ro" \
              --env GIT_CONFIG_COUNT=1 --env GIT_CONFIG_KEY_0=safe.directory --env GIT_CONFIG_VALUE_0=/repo \
              "$@"
          }
          flags=(--config /repo/.gitleaks.toml --gitleaks-ignore-path /repo/.gitleaksignore
            --ignore-gitleaks-allow --redact --verbose --no-banner)
          # gitleaks says «no leaks found» and exits 0 when its git cannot read the range: the same git of
          # the same image counts it first, and fails the step where it cannot.
          commits="$(image --entrypoint git molvia-gitleaks -C /repo rev-list --count 'HEAD^1..HEAD^2')"
          echo "the pull request's commits: $commits"
          # A merge of master shows what it brought against the branch — a conflict resolved by hand
          # included; without it `git log -p` shows a merge no diff (adversarial А1). `--text`: a file git
          # calls binary — by a NUL, by `-diff` in `.gitattributes` — is read as well (А3).
          found=0
          image molvia-gitleaks git /repo "${flags[@]}" \
            --log-opts='--text --diff-merges=first-parent HEAD^1..HEAD^2' || found=$?
          # A commit's message is as public as its diff, and gitleaks reads only the diff (А6): a file per
          # commit, so a finding's fingerprint names it.
          messages="$(mktemp -d)"
          for commit in $(git rev-list 'HEAD^1..HEAD^2'); do
            git log -1 --format=%B "$commit" > "$messages/$commit"
          done
          image --volume "$messages:/messages:ro" molvia-gitleaks dir /messages "${flags[@]}" || found=$?
          exit "$found"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # onnxruntime-node fetches CUDA and TensorRT on linux/x64 by default (MOL-105): the API runs
      # on the CPU, and the package carries the CPU build in itself.
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL: skip

      # What ships, high or critical, unless accepted with a day to look again (MOL-369, В-4 «б»).
      - name: npm audit of what ships
        run: node bin/npm-audit.mjs

      # `make format` mutates files, so CI checks instead of fixing: a diff must fail,
      # not be silently repaired.
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck

      # The receipt reader (MOL-125, В-6): its image built as the release builds it, and one live
      # read of a receipt the test draws itself — Tesseract and its language files are what no fake
      # of the API's tests can stand for. Here, not in `tests`: it needs no Postgres, and `tests` is the
      # longer path to green already (MOL-375).
      - run: docker build -f services/receipt-reader/Dockerfile -t molvia-receipt-reader:ci .
      - run: docker run --rm molvia-receipt-reader:ci python3 selftest.py

  tests:
    name: unit and integration tests
    runs-on: ubuntu-latest

    # Integration tests run against a real Postgres: pg_trgm and unaccent cannot be
    # faked, and they are exactly what catalogue search will stand on. The port and the
    # credentials match what bin/init-env.sh writes, so CI and a working copy agree.
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17-bookworm
        env:
          POSTGRES_DB: molvia_0
          POSTGRES_USER: molvia
          POSTGRES_PASSWORD: molvia
        ports:
          - 5500:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      # The merge's first parent too: the time reporter turns red only for the files the pull request
      # changes, `HEAD^1..HEAD` (MOL-266, В-4 «а»).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # onnxruntime-node fetches CUDA and TensorRT on linux/x64 by default (MOL-105): the API runs
      # on the CPU, and the package carries the CPU build in itself.
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL: skip

      # The same generator every working copy uses, so CI cannot drift from local setup.
      - run: ./bin/init-env.sh 0

      # The model of the search by meaning (MOL-105), which its integration tests read as a copy
      # does: cached by its specification, fetched and checked by sha256 when that changes.
      - name: Cache the embedding model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .models
          key: models-${{ hashFiles('backend/src/embeddings/model.json') }}
      - run: node bin/fetch-model.mjs

      - run: npm run test

  # The name the ruleset of master requires (MOL-164), over the two jobs it was split into (MOL-375):
  # `always()`, since a required job skipped counts as passed, and red unless both succeeded — failed,
  # cancelled and skipped alike.
  check:
    name: format, lint, types, tests
    needs: [static, tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: both jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "static, tests: $RESULTS"
          for result in $RESULTS; do [ "$result" = success ] || exit 1; done

  # Four shards side by side (MOL-375, В-1 «а»): on one runner the suite took 21–23 minutes. Playwright
  # splits by the count of tests, in the order of the projects, and never splits a project others depend on:
  # `pwa`, with `pwa-update.spec` in series, runs whole in each shard holding `csp-built`, on that shard's
  # own build. Every shard has its own database and stack. One red shard cancels no other: their flakes
  # and traces are wanted too. The count of shards is written once, the matrix: the total is its count of
  # legs, `strategy.job-total`, and the first step holds that each leg is its place in it.
  e2e:
    name: end-to-end shard ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # A shard took 5.3–7.9 minutes in three runs (MOL-375). A step that hangs is otherwise held for six
    # hours (MOL-295, В-2). The job's limit cancels it; the tests' own limit, below, fails the step first
    # while the steps before it are quick, and the traces go up either way.
    timeout-minutes: 25

    # The browsers and every system package they need come in the image (MOL-295): `playwright install
    # --with-deps` put 181 packages through apt on every run, and on a slow mirror that took 17 to 60
    # minutes. The tag is the version of @playwright/test in package-lock.json, which
    # bin/check-playwright-image.mjs holds in `npm run lint`. The runner's own uid, as Playwright's
    # documentation has it, so the workspace stays the runner's.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --user 1001

    # The API migrates at boot and refuses to start without a database, which is correct:
    # it cannot serve without one. So the end-to-end job needs a real database too — and
    # with it, /health reports ok rather than degraded, which is what a user would see.
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17-bookworm
        env:
          POSTGRES_DB: molvia_0
          POSTGRES_USER: molvia
          POSTGRES_PASSWORD: molvia
        # No port published: in the container's network the service is `postgres:5432`.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      # A matrix of `[1, 2, 2, 4]` would run shard 2 twice and shard 3 nowhere, every leg green
      # (adversarial А1): a leg runs the shard of its own place, `[1, 2, …, N]`, or fails in seconds.
      - name: the shard is the leg's place in the matrix
        env:
          SHARD: ${{ matrix.shard }}
          INDEX: ${{ strategy.job-index }}
        run: |
          [ "$SHARD" = "$((INDEX + 1))" ] || { echo "leg $((INDEX + 1)) of the matrix names shard $SHARD"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The image's Node is 24; ours is .nvmrc's.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # End-to-end runs without the model (MOL-105): the search must hold without it.
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
      - run: ./bin/init-env.sh 0
        env:
          MOLVIA_PG_HOST: postgres
          MOLVIA_PG_PORT: 5432

      # Its own limit, so a hung run ends red as failed rather than as cancelled, which reads as a newer
      # push: the job's 25 minutes less the image, `npm ci` and the upload (adversarial А5). Killed, it
      # prints no summary.
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        timeout-minutes: 20

      # The traces CI records — a retry's, and the first attempt's where a spec asks for it (MOL-217):
      # the `github` reporter writes no `playwright-report/`, so a flake left nothing here but its message.
      # Cancelled too: a slow pull leaves the tests less than their 20 minutes, and the job's limit
      # cancels them first (adversarial Б2). A run a newer push cancels uploads what it wrote as well.
      # A name per shard: one run takes no two artifacts of one name.
      - if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # The name the ruleset of master requires (MOL-164), over the shards (MOL-375): as `check`, run always
  # and red unless every shard succeeded — a matrix's result is all its legs'.
  e2e-gate:
    name: end-to-end
    needs: [e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: every shard succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "shards: $RESULTS"
          for result in $RESULTS; do [ "$result" = success ] || exit 1; done
