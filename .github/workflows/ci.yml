name: CI

on:
  push:
    branches: [master]
  pull_request:

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: format, lint, types, tests
    runs-on: ubuntu-latest

    # Integration tests run against a real Postgres: pg_trgm and unaccent cannot be
    # faked, and they are exactly what catalogue search will stand on. The port and the
    # credentials match what bin/init-env.sh writes, so CI and a working copy agree.
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17-bookworm
        env:
          POSTGRES_DB: molvia_0
          POSTGRES_USER: molvia
          POSTGRES_PASSWORD: molvia
        ports:
          - 5500:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # onnxruntime-node fetches CUDA and TensorRT on linux/x64 by default (MOL-105): the API runs
      # on the CPU, and the package carries the CPU build in itself.
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL: skip

      # The same generator every working copy uses, so CI cannot drift from local setup.
      - run: ./bin/init-env.sh 0

      # The model of the search by meaning (MOL-105), which its integration tests read as a copy
      # does: cached by its specification, fetched and checked by sha256 when that changes.
      - name: Cache the embedding model
        uses: actions/cache@v6
        with:
          path: .models
          key: models-${{ hashFiles('backend/src/embeddings/model.json') }}
      - run: node bin/fetch-model.mjs

      # `make format` mutates files, so CI checks instead of fixing: a diff must fail,
      # not be silently repaired.
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  e2e:
    name: end-to-end
    runs-on: ubuntu-latest

    # The API migrates at boot and refuses to start without a database, which is correct:
    # it cannot serve without one. So the end-to-end job needs a real database too — and
    # with it, /health reports ok rather than degraded, which is what a user would see.
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17-bookworm
        env:
          POSTGRES_DB: molvia_0
          POSTGRES_USER: molvia
          POSTGRES_PASSWORD: molvia
        ports:
          - 5500:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # End-to-end runs without the model (MOL-105): the search must hold without it.
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
      - run: ./bin/init-env.sh 0

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          # The browsers are in the key: saved only on a miss, a cache from before WebKit (MOL-80)
          # would have had it downloaded again on every run.
          key: playwright-chromium-webkit-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
