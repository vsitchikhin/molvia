name: Release

# Every commit that reaches master and passes CI is built and rolled out to production (MOL-90).
# A tag `v*` builds images under its own name — a mark and a point to roll back to — and deploys
# nothing: its commit is already there as `sha-…`. «Run workflow» with a tag rolls that tag out
# without building, which is how a rollback is done by hand.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to roll out: sha-<7 hex> or v<N>.<N>.<N>'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: build and publish
    # A red or cancelled CI builds nothing, and neither does CI of a pull request.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.commit.outputs.tag }}
    strategy:
      matrix:
        include:
          - { name: backend, dockerfile: backend/Dockerfile }
          - { name: bot, dockerfile: bot/Dockerfile }
          - { name: frontend, dockerfile: frontend/Dockerfile }

    steps:
      - uses: actions/checkout@v7
        with:
          # The commit CI passed. `github.sha` of a workflow_run is whatever master points at by
          # the time this starts, which may already be the next merge.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # Tags, for `git describe`.
          fetch-depth: 0

      # What the image is called and what /health says it is. A master build is always the long
      # form — `v0.1.1-3-g1a2b3c4`, `v0.1.2-0-g…` even on a tagged commit — so the deploy can tell
      # its own build from the one it replaces by the commit alone.
      - id: commit
        run: |
          sha="$(git rev-parse HEAD)"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            echo "tag=$GITHUB_REF_NAME" >>"$GITHUB_OUTPUT"
            echo "version=$GITHUB_REF_NAME" >>"$GITHUB_OUTPUT"
          else
            echo "tag=sha-${sha:0:7}" >>"$GITHUB_OUTPUT"
            echo "version=$(git describe --tags --match 'v*' --long)" >>"$GITHUB_OUTPUT"
          fi
          echo "revision=$sha" >>"$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/molvia-${{ matrix.name }}
          # Named by hand rather than by the event: a workflow_run carries master's head, not the
          # commit being built. A tag build publishes no `sha-…`: that name belongs to the master
          # build, whose version the deploy checks for.
          tags: |
            type=raw,value=${{ steps.commit.outputs.tag }}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_run' }}
          labels: |
            org.opencontainers.image.revision=${{ steps.commit.outputs.revision }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.name == 'backend' && format('APP_VERSION={0}', steps.commit.outputs.version) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: roll out to production
    needs: images
    if: >-
      always() &&
      ((github.event_name == 'workflow_run' && needs.images.result == 'success') ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # The environment holds the deploy key and admits master alone: a run from any other branch
    # waits for nothing and gets no secret.
    environment:
      name: production
      url: https://molvia.net
    # One rollout at a time, and the one in progress is never cancelled halfway.
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      TAG: ${{ needs.images.outputs.tag || inputs.tag }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Builds run side by side, so an older commit can finish after a newer one has gone out.
      # Only master's head is rolled out automatically; the commit that replaced this one brings
      # it along. A rollback by hand is older on purpose and is not asked.
      - name: still the head of master
        if: github.event_name == 'workflow_run'
        id: head
        env:
          BUILT: ${{ github.event.workflow_run.head_sha }}
        run: |
          head="$(git ls-remote origin refs/heads/master | cut -f1)"
          if [[ "$head" != "$BUILT" ]]; then
            echo "::notice::master has moved on to ${head:0:7}; that commit rolls out instead"
            echo "stale=true" >>"$GITHUB_OUTPUT"
          fi

      - name: ssh
        if: steps.head.outputs.stale != 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" >~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          # Pinned: scanning the host here would trust whoever answers first.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >~/.ssh/known_hosts
          cat >~/.ssh/config <<'EOF'
          Host production
            HostName molvia.net
            Port 2222
            User deploy
            IdentityFile ~/.ssh/deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
            ConnectTimeout 20
          EOF

      # The machine keeps its own copies of the compose file and of the deploy script, and the
      # key cannot replace them. A commit that changed either stops here, before anything moves.
      - name: the machine runs this commit's files
        if: steps.head.outputs.stale != 'true'
        run: |
          status="$(ssh production status)"
          echo "$status"
          drift=0
          for pair in compose:docker-compose.prod.yml deploy:deploy/deploy.sh; do
            name="${pair%%:*}" file="${pair#*:}"
            want="$(sha256sum "$file" | cut -d' ' -f1)"
            if ! grep -qx "$name=$want" <<<"$status"; then
              echo "::error file=$file::$file on the machine differs from this commit — copy it over (deploy/README.md, «Deploys») and re-run this job"
              drift=1
            fi
          done
          exit "$drift"

      - name: roll out
        if: steps.head.outputs.stale != 'true'
        run: ssh production "$TAG"

      - name: seen from outside
        if: steps.head.outputs.stale != 'true'
        run: |
          health="$(curl -fsS -m 10 https://molvia.net/api/health)"
          echo "$health"
          grep -q '"status":"ok"' <<<"$health"
