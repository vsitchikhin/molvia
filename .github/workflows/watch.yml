name: Watch

# Production seen from outside, every five minutes (MOL-142; owner's decision В-4 of MOL-149): the
# API with its database, the page, and the certificate's term. All well is a ping to the
# healthchecks.io check «molvia-up»; anything wrong is a ping to its `/fail` saying what. A ping
# that never comes — GitHub, the runner or this job down — is the alarm too, once the check's grace
# runs out. The alarm reaches the owner through healthchecks.io's own Telegram integration, never
# our bot: a machine that is down takes the bot with it. It only ever reads; nothing here can touch
# production. deploy/README.md, «Signals».
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      domain:
        description: 'Domain to watch; another one tries the alarm all the way to Telegram'
        required: true
        default: molvia.net

permissions: {}

# A run late behind GitHub's queue waits for the one before it rather than reporting beside it.
concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  production:
    name: production from outside
    # Never in a fork: it has no secret, and nothing of its own to watch.
    if: github.repository == 'vsitchikhin/molvia'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      # Red only when the job could not report — no secret, or the ping did not go. A site that is
      # down is a `/fail` and a green run: a red one would add GitHub's e-mail to the Telegram alarm.
      - env:
          HC_UP_URL: ${{ secrets.HC_UP_URL }}
          DOMAIN: ${{ inputs.domain || 'molvia.net' }}
        shell: bash
        run: |
          if [[ -z "$HC_UP_URL" ]]; then
            echo "::error::the secret HC_UP_URL is not set, there is nowhere to report (deploy/README.md, «Signals»)"
            exit 1
          fi

          # What is wrong, a line each; nothing when all is well. curl itself checks the certificate's
          # chain and name, so an invalid one is `000`; the term is checked apart, fourteen days ahead,
          # since Caddy renews by itself but fails silently when DNS does.
          problems() {
            local answer code pem end
            answer="$(curl -sS -m 10 -w '\n%{http_code}' "https://$DOMAIN/api/health" 2>/dev/null)" || answer=$'\n000'
            code="${answer##*$'\n'}"
            if [[ "$code" != 200 || "${answer%$'\n'*}" != *'"status":"ok"'* ]]; then
              echo "health $code"
            fi
            code="$(curl -sS -m 10 -o /dev/null -w '%{http_code}' "https://$DOMAIN/" 2>/dev/null)" || code=000
            if [[ "$code" != 200 ]]; then
              echo "pwa $code"
            fi
            pem="$(timeout 15 openssl s_client -servername "$DOMAIN" -connect "$DOMAIN:443" </dev/null 2>/dev/null)" || pem=""
            if ! end="$(openssl x509 -noout -enddate <<<"$pem" 2>/dev/null)"; then
              echo "cert unreadable"
            elif ! openssl x509 -noout -checkend 1209600 <<<"$pem" >/dev/null; then
              echo "cert expires ${end#notAfter=}"
            fi
            return 0
          }

          # Every merge is a rollout, and `up -d` leaves the API silent for seconds, while `/fail`
          # raises the alarm at once, with no grace. So a failure is believed only once four checks
          # half a minute apart all saw one — about as long as a rollout waits for health.
          for attempt in 1 2 3 4; do
            found="$(problems)"
            if [[ -z "$found" ]]; then
              break
            fi
            echo "attempt $attempt: ${found//$'\n'/; }"
            if ((attempt < 4)); then
              sleep 30
            fi
          done

          if [[ -z "$found" ]]; then
            curl -fsS -m 10 --retry 3 -o /dev/null "$HC_UP_URL"
            echo "$DOMAIN is well"
          else
            curl -fsS -m 10 --retry 3 -o /dev/null --data-raw "$found" "$HC_UP_URL/fail"
            echo "::warning::$DOMAIN: ${found//$'\n'/; }"
          fi
