name: Watch

# The certificate's term seen from outside (MOL-142; MOL-221): more than fourteen days left is a ping
# to the healthchecks.io check «molvia-cert», fewer is its `/fail` saying when it ends. The site
# itself — the API with its database and the page — is watched by the Worker on Cloudflare
# (`deploy/watch`): GitHub ran this schedule every two to six hours instead of every five minutes,
# which a certificate's term can bear and an availability watch cannot. A day without a ping is the
# alarm too. It only ever reads; nothing here can touch production. deploy/README.md, «Signals».
on:
  # Hourly, off the top of the hour, where GitHub's queue is longest: the check waits a day and an
  # hour, and the longest gap GitHub left between runs here was six hours.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      domain:
        description: 'Domain whose certificate to read'
        required: true
        default: molvia.net

permissions: {}

# A run late behind GitHub's queue waits for the one before it rather than reporting beside it.
concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  production:
    name: production from outside
    # Never in a fork: it has no secret, and nothing of its own to watch.
    if: github.repository == 'vsitchikhin/molvia'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # Red only when the job could not report — the secret missing, or a ping that did not go. A
      # certificate about to end is a `/fail` and a green run: a red one would add GitHub's e-mail
      # to Telegram.
      - env:
          HC_CERT_URL: ${{ secrets.HC_CERT_URL }}
          DOMAIN: ${{ inputs.domain || 'molvia.net' }}
        shell: bash
        run: |
          if [[ -z "$HC_CERT_URL" ]]; then
            echo "::error::the secret HC_CERT_URL is not set, there is nowhere to report (deploy/README.md, «Signals»)"
            exit 1
          fi

          # The term is a check of its own (adversarial Б2 of MOL-142): «expires in 13 days» is a
          # state that holds for days, and healthchecks.io speaks only when a check flips — on one
          # check with the site, it would have kept a fall of the API silent all that time. Caddy
          # renews by itself but fails silently when DNS does, hence fourteen days ahead. A
          # certificate that could not be read is the site's matter, the Worker's to say: it reports
          # nothing here, and the check's day of grace waits for a run that can read it.
          pem="$(timeout 15 openssl s_client -servername "$DOMAIN" -connect "$DOMAIN:443" </dev/null 2>/dev/null)" || pem=""
          if ! end="$(openssl x509 -noout -enddate <<<"$pem" 2>/dev/null)"; then
            echo "::warning::$DOMAIN: the certificate could not be read"
          elif openssl x509 -noout -checkend 1209600 <<<"$pem" >/dev/null; then
            curl -fsS -m 10 --retry 3 -o /dev/null "$HC_CERT_URL"
            echo "$DOMAIN: the certificate ends ${end#notAfter=}"
          else
            curl -fsS -m 10 --retry 3 -o /dev/null --data-raw "cert expires ${end#notAfter=}" "$HC_CERT_URL/fail"
            echo "::warning::$DOMAIN: the certificate expires ${end#notAfter=}"
          fi
