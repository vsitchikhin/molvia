version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Grouped on purpose: a solo project drowns in one pull request per package, and a
    # drowned author stops reading them, which is worse than updating a week later.
    groups:
      # Playwright apart (MOL-295): the end-to-end image's tag is its version, which Dependabot never
      # moves, so its pull request is red until a commit of ours moves the tag — and the other
      # packages of the week go green on their own rather than waiting in it.
      playwright:
        patterns: ['@playwright/test', 'playwright', 'playwright-core']
      minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns: ['@playwright/test', 'playwright', 'playwright-core']
      # A fix of a known vulnerability, whatever its size, in one pull request (MOL-364): ungrouped,
      # security updates open one per advisory. Playwright apart here too — its pull request is red
      # until the image's tag is moved, and the week's fixes would wait in it.
      security:
        applies-to: security-updates
        patterns: ['*']
        exclude-patterns: ['@playwright/test', 'playwright', 'playwright-core']
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'ci(deps)'

  # The base images (MOL-364): pinned by an exact tag and its digest, which Dependabot moves together —
  # a floating tag it never moves, and a release of Caddy would go unseen.
  - package-ecosystem: docker
    directories:
      - /frontend
      - /backend
      - /bot
      - /services/receipt-reader
      - /deploy/grafana
      - /deploy/victoria
      # The scanners of CI (MOL-369): images of their own authors, moved here with the rest.
      - /.github/scanners/gitleaks
      - /.github/scanners/trivy
    schedule:
      interval: weekly
      day: monday
    ignore:
      # Node's major is `.nvmrc`'s, which CI runs on too: moved by a commit of ours, never by the bot.
      - dependency-name: node
        update-types: [version-update:semver-major]
    groups:
      images:
        patterns: ['*']
    commit-message:
      prefix: 'build(deps)'
