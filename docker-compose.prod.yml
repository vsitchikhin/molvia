# Production stack for a single VPS. Everything is on one machine and one network;
# only Caddy is reachable from outside, and it is the only thing holding a certificate.
#
#   cp .env.prod.example .env.prod   # then fill it in on the server
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

name: molvia

# Everything the containers write goes to the host's journal, and the journal keeps it for
# fourteen days (MOL-58). Docker's default `json-file` keeps it forever, and rotating it by size
# is not a term: at this traffic ten megabytes last for months. The term itself is set on the
# machine — `deploy/README.md`, «Once, on a new machine». `docker compose logs` still works.
# `LOG_DRIVER` exists only for trying the stack on a laptop: Docker Desktop has no journald and
# refuses to start a container that asks for it.
x-logging: &logging
  driver: ${LOG_DRIVER:-journald}
  options:
    tag: 'molvia-{{.Name}}'

services:
  postgres:
    logging: *logging
    # pgvector for the embeddings (MOL-105), on Debian: ICU for `collate "und-x-icu"` (MOL-31) and
    # glibc for text. The tag is exact — the image is part of the contract, and a move of libc
    # rebuilds every text index (migration 0038). Changed here, it changes in docker-compose.yml,
    # CI and the restore drill too.
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    restart: unless-stopped
    # Its own errors without DETAIL (MOL-58, selfreview 9): a refused duplicate reads
    # `Key (telegram_user_id)=(…) already exists`, and that journal lives fourteen days too.
    command: ['postgres', '-c', 'log_error_verbosity=terse']
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    # Deliberately not published: the database is reachable only over the compose
    # network, so the only way in is through a container.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    logging: *logging
    # Built by CI and pulled on the server, so the machine needs neither the source nor
    # a toolchain. `build` stays for building the same image locally.
    image: ghcr.io/vsitchikhin/molvia-backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 3300
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:?set TELEGRAM_BOT_USERNAME}
      BOT_API_SECRET: ${BOT_API_SECRET:?set BOT_API_SECRET}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Optional: empty leaves the Open Food Facts hint off (MOL-162).
      OPEN_FOOD_FACTS_CONTACT: ${OPEN_FOOD_FACTS_CONTACT:-}
      # The receipt reader below (MOL-125); while it is down, receipts wait in the queue.
      RECEIPT_READER_URL: http://receipt-reader:8080
      # Whom the bot tells of a new failure (MOL-143): the owner's Telegram id. Required as a line,
      # as BOT_PULSE_URL is: a forgotten one would leave every failure silent and nobody would know.
      # Empty, on purpose, keeps the failures in their table and tells nobody.
      OWNER_TELEGRAM_ID: ${OWNER_TELEGRAM_ID?set OWNER_TELEGRAM_ID in .env.prod, or leave it empty to tell nobody}
    depends_on:
      postgres:
        condition: service_healthy

  receipt-reader:
    logging: *logging
    # Tesseract and the language files MOL-114 measured, behind a small HTTP server: a photo in, its
    # text out. No database, no disk but /tmp, no port outside the compose network (MOL-125, В-1).
    image: ghcr.io/vsitchikhin/molvia-receipt-reader:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/receipt-reader/Dockerfile
    restart: unless-stopped
    # Three of the four cores and a gigabyte: a receipt takes them for half a minute, and the API,
    # the bot and Postgres keep the fourth (MOL-113, «Ресурсы сервера»).
    cpus: 3
    mem_limit: 1g
    read_only: true
    tmpfs:
      - /tmp

  bot:
    logging: *logging
    # Built by CI and pulled on the server, so the machine needs neither the source nor
    # a toolchain. `build` stays for building the same image locally.
    image: ghcr.io/vsitchikhin/molvia-bot:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: bot/Dockerfile
    # on-failure, not unless-stopped: with no token the bot exits 0 on purpose, and it
    # should then stay down instead of being restarted forever.
    restart: on-failure
    # Time to finish an evening's messages on a deploy (MOL-101, review Т-4): the reminders a claim
    # handed over are already marked sent, and a stop in the middle of them loses the rest for good.
    # The default ten seconds is shorter than a full minute of 19:00 at Telegram's pace.
    stop_grace_period: 30s
    environment:
      NODE_ENV: production
      API_PORT: 3300
      API_BASE_URL: http://backend:3300
      # Where the greeting points people: the same host Caddy serves the PWA on.
      APP_BASE_URL: https://${DOMAIN:?set DOMAIN}
      BOT_API_SECRET: ${BOT_API_SECRET:?set BOT_API_SECRET}
      # Real login requires the bot to run (MOL-54).
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN}
      # The bot's pulse to healthchecks.io (MOL-142). A line missing from `.env.prod` refuses to
      # start: a check that never got a ping stays «new» and never raises an alarm, so a forgotten
      # line would never be noticed (adversarial В1). Empty, on purpose, switches the pulse off.
      BOT_PULSE_URL: ${BOT_PULSE_URL?set BOT_PULSE_URL in .env.prod, or leave it empty to switch the pulse off}
    depends_on:
      - backend

  frontend:
    logging: *logging
    # Built by CI and pulled on the server, so the machine needs neither the source nor
    # a toolchain. `build` stays for building the same image locally.
    image: ghcr.io/vsitchikhin/molvia-frontend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    ports:
      # Overridable so the whole production stack can be tried on a machine where 80 or
      # 443 are already taken, without editing this file.
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  pgdata:
  caddy_data:
  caddy_config:
