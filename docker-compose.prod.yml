# Production stack for a single VPS. Everything is on one machine and one network;
# only Caddy is reachable from outside, and it is the only thing holding a certificate.
#
#   cp .env.prod.example .env.prod   # then fill it in on the server
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

name: molvia

# Everything the containers write goes to the host's journal, and the journal keeps it for
# fourteen days (MOL-58). Docker's default `json-file` keeps it forever, and rotating it by size
# is not a term: at this traffic ten megabytes last for months. The term itself is set on the
# machine — `deploy/README.md`, «Once, on a new machine». `docker compose logs` still works.
# `LOG_DRIVER` exists only for trying the stack on a laptop: Docker Desktop has no journald and
# refuses to start a container that asks for it.
x-logging: &logging
  driver: ${LOG_DRIVER:-journald}
  options:
    tag: 'molvia-{{.Name}}'

services:
  postgres:
    logging: *logging
    # pgvector for the embeddings (MOL-105), on Debian: ICU for `collate "und-x-icu"` (MOL-31) and
    # glibc for text. The tag is exact — the image is part of the contract, and a move of libc
    # rebuilds every text index (migration 0038). Changed here, it changes in docker-compose.yml,
    # CI and the restore drill too.
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    restart: unless-stopped
    # Its own errors without DETAIL (MOL-58, selfreview 9): a refused duplicate reads
    # `Key (telegram_user_id)=(…) already exists`, and that journal lives fourteen days too.
    command: ['postgres', '-c', 'log_error_verbosity=terse']
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    # Deliberately not published: the database is reachable only over the compose
    # network, so the only way in is through a container.
    volumes:
      - pgdata:/var/lib/postgresql/data
    # The metrics' network too, for its exporter (MOL-145); the database still publishes no port.
    networks: [default, metrics]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    logging: *logging
    # Built by CI and pulled on the server, so the machine needs neither the source nor
    # a toolchain. `build` stays for building the same image locally.
    image: ghcr.io/vsitchikhin/molvia-backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 3300
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:?set TELEGRAM_BOT_USERNAME}
      BOT_API_SECRET: ${BOT_API_SECRET:?set BOT_API_SECRET}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # The password the API gives the exporter's role at every start (MOL-366): the role is made, kept
      # to its form and its password set by the API, never by a migration — a copy carries no role.
      METRICS_DB_PASSWORD: ${METRICS_DB_PASSWORD:?set METRICS_DB_PASSWORD}
      # The nightly merge of twins (MOL-106): `report` says each morning what it would merge, `on`
      # merges — the owner's word, one line in .env.prod (В-3).
      CATALOGUE_MERGE: ${CATALOGUE_MERGE:-report}
      # The «фф» (MOL-382): `on` shows a feature, `off` keeps it an address the API has not got — one line
      # a flag in .env.prod, written by `./ff.sh <name> on|off`, and `up -d backend`, no release; another
      # value stops the API's start, a name not passed here never reaches it (deploy/README.md).
      FF_VENUES: ${FF_VENUES:-off}
      FF_PAYMENTS: ${FF_PAYMENTS:-off}
      # Ameriabank vPOS (MOL-277): read while FF_PAYMENTS is on, then required.
      VPOS_STAND: ${VPOS_STAND:-}
      VPOS_CLIENT_ID: ${VPOS_CLIENT_ID:-}
      VPOS_USERNAME: ${VPOS_USERNAME:-}
      VPOS_PASSWORD: ${VPOS_PASSWORD:-}
      # Optional: empty leaves the Open Food Facts hint off (MOL-162).
      OPEN_FOOD_FACTS_CONTACT: ${OPEN_FOOD_FACTS_CONTACT:-}
      PURS_CONTACT: ${PURS_CONTACT:-}
      # The receipt reader below (MOL-125); while it is down, receipts wait in the queue.
      RECEIPT_READER_URL: http://receipt-reader:8080
      # The model that reads the receipts of those it is granted to (MOL-272); empty, Tesseract reads all.
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      CLAUDE_WORKSPACE_ID: ${CLAUDE_WORKSPACE_ID:-}
      RECEIPT_MODEL_MONTHLY_CAP_USD: ${RECEIPT_MODEL_MONTHLY_CAP_USD:-200}
      # Whom the bot tells of a new failure (MOL-143): the owner's Telegram id, digits only. Required
      # and filled since MOL-145 — the alarms of the metrics go to it too, so empty is no longer a way
      # to tell nobody: compose refuses to start (review №3).
      OWNER_TELEGRAM_ID: ${OWNER_TELEGRAM_ID:?set OWNER_TELEGRAM_ID in .env.prod — the failures and the alarms go to it}
      # Where `make failures` reads the phone's maps from, beside the PWA's build (MOL-144).
      APP_BASE_URL: https://${DOMAIN:?set DOMAIN}
      # `/metrics` on a port of its own (MOL-145, В-1): the metrics' network scrapes it, and Caddy,
      # which proxies only 3300, cannot reach it by any spelling of a path.
      METRICS_PORT: 9464
    networks: [default, metrics]
    depends_on:
      postgres:
        condition: service_healthy

  receipt-reader:
    logging: *logging
    # Tesseract and the language files MOL-114 measured, behind a small HTTP server: a photo in, its
    # text out. No database, no disk but /tmp, no port outside the compose network (MOL-125, В-1).
    image: ghcr.io/vsitchikhin/molvia-receipt-reader:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/receipt-reader/Dockerfile
    restart: unless-stopped
    # Three of the four cores and a gigabyte: a receipt takes them for half a minute, and the API,
    # the bot and Postgres keep the fourth (MOL-113, «Ресурсы сервера»).
    cpus: 3
    mem_limit: 1g
    read_only: true
    tmpfs:
      - /tmp

  bot:
    logging: *logging
    # Built by CI and pulled on the server, so the machine needs neither the source nor
    # a toolchain. `build` stays for building the same image locally.
    image: ghcr.io/vsitchikhin/molvia-bot:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: bot/Dockerfile
    # on-failure, not unless-stopped: with no token the bot exits 0 on purpose, and it
    # should then stay down instead of being restarted forever.
    restart: on-failure
    # Time to finish an evening's messages on a deploy (MOL-101, review Т-4): the reminders a claim
    # handed over are already marked sent, and a stop in the middle of them loses the rest for good.
    # The default ten seconds is shorter than a full minute of 19:00 at Telegram's pace.
    stop_grace_period: 30s
    environment:
      NODE_ENV: production
      API_PORT: 3300
      API_BASE_URL: http://backend:3300
      # Where the greeting points people: the same host Caddy serves the PWA on.
      APP_BASE_URL: https://${DOMAIN:?set DOMAIN}
      BOT_API_SECRET: ${BOT_API_SECRET:?set BOT_API_SECRET}
      # Real login requires the bot to run (MOL-54).
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN}
      # The bot's pulse to healthchecks.io (MOL-142). A line missing from `.env.prod` refuses to
      # start: a check that never got a ping stays «new» and never raises an alarm, so a forgotten
      # line would never be noticed (adversarial В1). Empty, on purpose, switches the pulse off.
      BOT_PULSE_URL: ${BOT_PULSE_URL?set BOT_PULSE_URL in .env.prod, or leave it empty to switch the pulse off}
    depends_on:
      - backend

  frontend:
    logging: *logging
    # Built by CI and pulled on the server, so the machine needs neither the source nor
    # a toolchain. `build` stays for building the same image locally.
    image: ghcr.io/vsitchikhin/molvia-frontend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    ports:
      # Overridable so the whole production stack can be tried on a machine where 80 or
      # 443 are already taken, without editing this file.
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend-volumes:
        condition: service_completed_successfully
      backend:
        condition: service_started

  # Gives Caddy's volumes to its user (MOL-365): Docker hands a volume the owner of the image's directory
  # only while it is empty, and these hold the certificate and the ACME account as root 0600 — Caddy as
  # `caddy` on them would not start, and the rollout would roll back. At every `up` of `frontend`, after
  # compose has stopped the Caddy it replaces, so nothing writes the volumes while it walks them (a file
  # gone mid-walk is an exit of 1, adversarial А1). The files an image of before MOL-365, put back by a
  # rollback, writes as root are given back by the next one. The frontend's image of the same tag, root
  # for this alone, with no network and only the rights a `chown` needs. Numbers, never names: an image
  # of before MOL-365 has no `caddy` (`compose-volumes.integration.test.ts` holds them to the Dockerfile).
  frontend-volumes:
    logging: *logging
    image: ghcr.io/vsitchikhin/molvia-frontend:${IMAGE_TAG:-latest}
    user: '0'
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH]
    entrypoint: [chown, -R, '10001:10001', /caddy/data, /caddy/config]
    volumes:
      - caddy_data:/caddy/data
      - caddy_config:/caddy/config

  # ── The metrics (MOL-145) ──────────────────────────────────────────────────────────────────────
  # VictoriaMetrics and three exporters on a network with no way out (`metrics`, `internal`): what
  # sees the whole machine or the database can send nothing anywhere. Grafana stands in both, since
  # its alarms go to Telegram, and publishes one port, on the loopback, for an SSH tunnel. None of
  # them is in the rollout's check of the tag, and a rollback leaves them as they run (Р-11).

  victoria:
    logging: *logging
    # VictoriaMetrics single with the scrape config of `deploy/victoria` baked in (В-2): a change to
    # what is scraped is a merge, as any other.
    image: ghcr.io/vsitchikhin/molvia-victoria:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: deploy/victoria/Dockerfile
    restart: unless-stopped
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=30d
      - -promscrape.config=/etc/victoria/scrape.yml
      - -httpListenAddr=:8428
    mem_limit: 256m
    volumes:
      - vmdata:/storage
    depends_on:
      victoria-volumes:
        condition: service_completed_successfully
    networks: [metrics]

  # Gives `vmdata` to nobody, VictoriaMetrics' user (MOL-365), as `frontend-volumes` gives Caddy's: at
  # every `up` of `victoria`, after compose has stopped the one it replaces — never while it writes (А1).
  # Its own image, root for this alone; the number is held to its Dockerfile by the same test.
  victoria-volumes:
    logging: *logging
    image: ghcr.io/vsitchikhin/molvia-victoria:${IMAGE_TAG:-latest}
    user: '0'
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH]
    entrypoint: [chown, -R, '65534:65534', /storage]
    volumes:
      - vmdata:/storage

  node-exporter:
    logging: *logging
    # The machine's memory, CPU, load and disk, read from its /proc, /sys and / mounted read-only.
    # Not on the host's network — that would be a port outside — so the machine's network counters
    # are not here: inside the container they would be the container's own (Р-7).
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --no-collector.netdev
      - --no-collector.netstat
      - --no-collector.netclass
      - --no-collector.sockstat
      - --no-collector.arp
    pid: host
    read_only: true
    mem_limit: 64m
    volumes:
      - /:/host:ro,rslave
    networks: [metrics]

  cadvisor:
    logging: *logging
    # Every container's memory, CPU and OOM; a restart is its CPU counter starting over (Р-4).
    # Docker's socket is root on the machine, read-only or not; that is why it has no port and no way
    # out (Р-8). `docker_only` and fifteen seconds between looks — below ten it eats a core — and only
    # the groups the dashboard reads.
    image: ghcr.io/google/cadvisor:v0.60.6
    restart: unless-stopped
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --enable_metrics=cpu,memory,oom_event
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service
    cpus: 0.5
    mem_limit: 192m
    # The OOM-killer is read from the kernel's log, and Debian and Ubuntu let only CAP_SYSLOG read it
    # (`kernel.dmesg_restrict=1`): without it every OOM counts 0 in silence (review №1).
    cap_add:
      - SYSLOG
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Docker 29 keeps its containers in containerd, and cAdvisor's docker factory reads them through
      # this socket: without it the factory failed to register, and on the server cAdvisor saw the
      # machine alone — no container, no restart, no OOM — while Docker Desktop showed them all.
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks: [metrics]

  postgres-exporter:
    logging: *logging
    # Connections, the size of the database, the longest transaction — figures, never a query's text
    # (В-4). Its own role, `pg_monitor` and no table (MOL-366): no way out kept it from taking anything
    # away, not from erasing it — the database's own user was the cluster's superuser.
    image: prometheuscommunity/postgres-exporter:v0.20.1
    restart: unless-stopped
    command:
      - --collector.long_running_transactions
    environment:
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB}?sslmode=disable
      DATA_SOURCE_USER: molvia_metrics
      DATA_SOURCE_PASS: ${METRICS_DB_PASSWORD:?set METRICS_DB_PASSWORD}
    read_only: true
    mem_limit: 64m
    networks: [metrics]
    depends_on:
      postgres:
        condition: service_healthy

  grafana:
    logging: *logging
    # Grafana with the dashboard, the alarms and their contact point of `deploy/grafana` baked in (В-2):
    # what the repository says is what runs, and a change made in the interface is not kept (Р-10).
    image: ghcr.io/vsitchikhin/molvia-grafana:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: deploy/grafana/Dockerfile
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # `admin` is reached only by the SSH tunnel to the loopback port, and its password is the lock.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      # Grafana calls home by default; nothing of a third party sees this machine (Р-6).
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_ANALYTICS_FEEDBACK_LINKS_ENABLED: 'false'
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
      GF_SECURITY_DISABLE_GRAVATAR: 'true'
      GF_SNAPSHOTS_EXTERNAL_ENABLED: 'false'
      GF_PLUGINS_PUBLIC_KEY_RETRIEVAL_DISABLED: 'true'
      # Grafana fetches five plugins from grafana.com at every start unless told not to.
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
      # From any device of the owner (MOL-399, В-6 «а»): the dashboard shared by link, which `tunnel`
      # below brings to `grafana.<DOMAIN>` behind Cloudflare Access. A visitor of the link signs in to
      # nothing — it runs the dashboard's own panels and no other query, no API, no proxy — so nobody
      # from outside is a user of Grafana. The link Grafana makes is the root's.
      GF_SERVER_ROOT_URL: https://grafana.${DOMAIN:?set DOMAIN}
      GF_PUBLIC_DASHBOARDS_ENABLED: 'true'
      # The alarms' own bot (В-3), never the product's: the login's token stays out of a container
      # that goes to the internet. Whom it writes is the owner the failures go to (MOL-143), put
      # into the contact point by `deploy/grafana/start.sh`.
      ALERTS_BOT_TOKEN: ${ALERTS_BOT_TOKEN:?set ALERTS_BOT_TOKEN}
      OWNER_TELEGRAM_ID: ${OWNER_TELEGRAM_ID:?set OWNER_TELEGRAM_ID in .env.prod — the failures and the alarms go to it}
      # The alarms' pulse (adversarial А5): Grafana is the one that sends, and nothing else watched it.
      # A rule that fires while Grafana counts and VictoriaMetrics answers pings the healthchecks.io
      # check «molvia-alerts» every five minutes; its silence is healthchecks.io's own Telegram.
      ALERTS_PULSE_URL: ${ALERTS_PULSE_URL:?set ALERTS_PULSE_URL — the alarms would be watched by nobody}
    # 384 MB was the guess before production; opening the interface took Grafana 13 past it and the
    # OOM-killer took Grafana — and the alarms with it — on the first login (04.10.2026).
    mem_limit: 768m
    ports:
      # The one port of the metrics, on the machine's loopback only: `ssh -L 3000:127.0.0.1:3000` —
      # Grafana whole, `admin`'s way in, and the dashboard's when Cloudflare is down (MOL-399, Р-3).
      - '127.0.0.1:${GRAFANA_PORT:-3000}:3000'
    volumes:
      - grafana_data:/var/lib/grafana
    # Its own network for the way to Telegram (review №4): in `default` it stood beside Caddy, the API,
    # the bot and the receipt reader, which asks nobody who calls.
    networks: [alerts, metrics]
    depends_on:
      - victoria

  tunnel:
    logging: *logging
    # Cloudflare Tunnel to Grafana (MOL-399): a connection out to Cloudflare, so the machine opens no
    # port. The tunnel is managed locally (В-6 «а»): what it passes is `tunnel.yml` below, never
    # Cloudflare's dashboard (deploy/README.md, «Metrics»). An upstream image of an exact tag, which
    # Dependabot moves.
    image: cloudflare/cloudflared:2026.11.0
    restart: unless-stopped
    # The image's entrypoint is `cloudflared --no-autoupdate`: the version is this file's.
    command: ['tunnel', '--config', '/etc/cloudflared/config.yml', 'run']
    configs:
      - source: tunnel
        target: /etc/cloudflared/config.yml
    environment:
      # The environment, never `--token`: an argument is read by every user of the machine in `ps`.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN — the token of the tunnel to Grafana}
    mem_limit: 128m
    # Grafana's network alone, never `metrics`: all the tunnel can reach is Grafana — not
    # VictoriaMetrics, which has no password, nor the API.
    networks: [alerts]
    depends_on:
      - grafana

configs:
  # What the tunnel passes (MOL-399, В-6 «а», adversarial А1–А3): the shared dashboard's page, its
  # files and its answers, and nothing else of Grafana — no login, no API, no data source's proxy —
  # whatever Access lets through or would, switched off. Anything else is the tunnel's own 404.
  tunnel:
    content: |
      ingress:
        - hostname: grafana.${DOMAIN:?set DOMAIN}
          path: ^/(public-dashboards|public|api/public)/
          service: http://grafana:3000
        - service: http_status:404

networks:
  default: {}
  # Grafana's and its tunnel's: a way out to Telegram, healthchecks.io and Cloudflare, and no other
  # neighbour (review №4, MOL-399).
  alerts: {}
  # No way out of it: neither an exporter nor VictoriaMetrics reaches the internet (Р-7).
  metrics:
    internal: true

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  vmdata:
  grafana_data:
