<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- `interactive-widget`: Chrome on Android shrinks the page when the keyboard opens, so the
         sheet stays above it (MOL-18). Android only: Safari 27 began to honour it and shrank the
         window under the keyboard to the part left visible — the likeliest reason the tab bar
         stood mid-screen in the installed app, a window not given back (hotfix-bottom-menu). On
         iOS useKeyboardInset lifts the sheet. Here, before the page is laid out, not later from a
         module: the viewport is read as the head is parsed. -->
    <script>
      if (/Android/.test(navigator.userAgent)) {
        const viewport = document.querySelector('meta[name="viewport"]')
        viewport.content += ', interactive-widget=resizes-content'
      }
    </script>
    <!-- The status bar of the installed app is painted with this. It is --surface of each
         scheme, so the bar runs into the header without a seam; theme-color.test.ts holds
         both values to _tokens.scss. -->
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#fffaf2"
      data-scheme-of="light"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#201c19"
      data-scheme-of="dark"
    />
    <!-- The scheme the person chose on this device (MOL-111), before anything is painted: the
         module that keeps it is deferred, and a dark screen flashing white at every launch is the
         thing this prevents. After the theme colours, which it points, and before the styles. The
         one reader of storage outside storage.ts, and it reads as `read` does — the shared shelf,
         then this tab's, the first value found — so the two never answer differently;
         useColorScheme.ts does the rest, and its test runs this script. -->
    <script>
      ;(() => {
        let value = null
        for (const shelf of ['localStorage', 'sessionStorage']) {
          try {
            value = window[shelf].getItem('molvia.scheme')
          } catch {
            value = null
          }
          if (value) break
        }
        if (value !== 'light' && value !== 'dark') return
        document.documentElement.dataset.scheme = value
        for (const meta of document.querySelectorAll('meta[name="theme-color"]')) {
          meta.setAttribute('media', meta.dataset.schemeOf === value ? 'all' : 'not all')
        }
      })()
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Molvia</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
