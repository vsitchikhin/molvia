<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- The status bar of the installed app is painted with this. It is --surface of each
         scheme, so the bar runs into the header without a seam; theme-color.test.ts holds
         both values to _tokens.scss. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fffaf2" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#201c19" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Molvia</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
