# What VictoriaMetrics scrapes (MOL-145): every target on the `metrics` network, every fifteen seconds.
# The API's figures come from its own port, never through Caddy (В-1).
global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ['backend:9464']
  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']
  # Itself: an empty dashboard because VictoriaMetrics is down is told apart from one because a target is.
  - job_name: victoria
    static_configs:
      - targets: ['localhost:8428']
